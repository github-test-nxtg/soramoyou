<!doctype html>
<html lang="ja" data-sky="clear">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>そらもよう｜いまの天気</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --day-a:#BFE0F4; --day-b:#EEF6FB; --day-ink:#12324A; --day-soft:#4D6B80;
  --sun:#E8A21C; --rain:#3D72A8;
  --sky-a:var(--day-a); --sky-b:var(--day-b); --ink:var(--day-ink); --ink-soft:var(--day-soft);
  --line:color-mix(in oklab, var(--ink) 18%, transparent);
  --field:color-mix(in oklab, var(--sky-b) 70%, white);
  --font-num:"Bricolage Grotesque", "Zen Kaku Gothic New", system-ui, sans-serif;
  --font-ui:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
:root[data-sky="cloudy"]{--day-a:#C9D2DA;--day-b:#ECEFF2;--day-ink:#25323D;--day-soft:#56636E}
:root[data-sky="fog"]{--day-a:#D5D9D5;--day-b:#F0F1EE;--day-ink:#2A322F;--day-soft:#5E6762}
:root[data-sky="rain"]{--day-a:#8EA2B4;--day-b:#CDD6DE;--day-ink:#172534;--day-soft:#3E5163}
:root[data-sky="snow"]{--day-a:#DCE6EF;--day-b:#FAFCFD;--day-ink:#1E3142;--day-soft:#58697A}
:root[data-sky="storm"]{--day-a:#3B4352;--day-b:#6D7584;--day-ink:#F1F3F6;--day-soft:#C3C9D2;--field:#4A5262}
:root[data-sky="night"]{--day-a:#121A33;--day-b:#2A3660;--day-ink:#E8ECF7;--day-soft:#A6B2D1;--field:#2E3A63;--sun:#F3D27A}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-a:color-mix(in oklab, var(--day-a) 32%, #0D1424);
    --sky-b:color-mix(in oklab, var(--day-b) 16%, #0D1424);
    --ink:#E6ECF4; --ink-soft:#9DAEC4; --field:#1B2438; --rain:#7FB0E0;
  }
}
:root[data-theme="dark"]{
  --sky-a:color-mix(in oklab, var(--day-a) 32%, #0D1424);
  --sky-b:color-mix(in oklab, var(--day-b) 16%, #0D1424);
  --ink:#E6ECF4; --ink-soft:#9DAEC4; --field:#1B2438; --rain:#7FB0E0;
}
html{min-height:100%;background:var(--sky-b);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--font-ui);
  background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 70%);
  line-height:1.6;-webkit-font-smoothing:antialiased;
}
main{max-width:760px;margin:0 auto;padding:1.25rem 1.25rem 3rem}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* search */
.bar{display:flex;gap:.5rem;align-items:center;position:relative}
.bar form{flex:1;display:flex;min-width:0}
.bar input{
  flex:1;min-width:0;border:1px solid var(--line);background:var(--field);
  border-radius:999px 0 0 999px;padding:.6rem 1rem;font-size:.95rem;
}
.bar input::placeholder{color:var(--ink-soft)}
.btn{
  border:1px solid var(--line);background:var(--field);padding:.6rem 1rem;
  cursor:pointer;font-size:.9rem;white-space:nowrap;
}
.bar form .btn{border-radius:0 999px 999px 0;border-left:0}
.btn.loc{border-radius:999px}
.btn:hover{background:color-mix(in oklab,var(--field) 80%,var(--ink))}
.results{
  position:absolute;top:calc(100% + .4rem);left:0;right:0;z-index:5;list-style:none;margin:0;padding:.3rem;
  background:var(--field);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 30px -12px color-mix(in oklab,var(--ink) 40%,transparent);
}
.results[hidden]{display:none}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:.55rem .75rem;border-radius:10px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:color-mix(in oklab,var(--field) 85%,var(--ink))}
.results small{color:var(--ink-soft);margin-left:.4rem}

.notice{margin:.9rem 0 0;font-size:.85rem;color:var(--ink-soft);min-height:1.4em}
.notice.demo{
  color:var(--ink);background:color-mix(in oklab,var(--sun) 22%,transparent);
  border-left:3px solid var(--sun);padding:.5rem .75rem;border-radius:0 8px 8px 0;
}

/* hero */
.hero{margin-top:1.5rem;display:grid;grid-template-columns:1fr auto;align-items:end;gap:.5rem 1rem}
.place{grid-column:1/-1;margin:0;font-size:1.15rem;font-weight:700;letter-spacing:.02em}
.place small{font-weight:400;color:var(--ink-soft);font-size:.85rem;margin-left:.5rem}
.temp{
  font-family:var(--font-num);font-weight:300;font-variation-settings:"opsz" 96;
  font-size:clamp(6.5rem,24vw,11.5rem);line-height:.82;letter-spacing:-.05em;margin:.2rem 0 0;
}
.temp sup{font-size:.38em;font-weight:400;vertical-align:.95em;letter-spacing:0;margin-left:.04em}
.hero-icon{width:clamp(96px,26vw,150px);height:auto;color:var(--ink)}
.cond{grid-column:1/-1;margin:.6rem 0 0;font-size:1.6rem;font-weight:500}
.range{font-family:var(--font-num);font-size:1.05rem;color:var(--ink-soft);margin-left:.6rem;font-weight:400}
.facts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.4rem 1.75rem;margin:.75rem 0 0}
.facts div{display:flex;gap:.45rem;align-items:baseline}
.facts dt{font-size:.82rem;color:var(--ink-soft)}
.facts dd{margin:0;font-family:var(--font-num);font-size:1.1rem}
.stamp{grid-column:1/-1;font-size:.78rem;color:var(--ink-soft);margin:.4rem 0 0}

h2{font-size:.95rem;font-weight:700;margin:2.5rem 0 .6rem;letter-spacing:.04em}

/* hourly */
.hourly{overflow-x:auto;overflow-y:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);scrollbar-width:thin}
.hourly svg{display:block;max-width:none}
.hourly text{fill:var(--ink);font-family:var(--font-num)}
.hourly .soft{fill:var(--ink-soft);font-family:var(--font-ui)}
.hourly .pop{fill:var(--rain)}

/* daily */
.daily{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.daily li{
  display:grid;grid-template-columns:5.2rem 2rem 2.8rem 2.4rem 1fr 2.4rem;
  align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line);
}
.daily .d{font-weight:500}
.daily .d small{display:block;font-weight:400;font-size:.75rem;color:var(--ink-soft);line-height:1.2}
.daily svg{width:28px;height:28px}
.daily .p{font-family:var(--font-num);font-size:.85rem;color:var(--rain);text-align:right}
.daily .lo,.daily .hi{font-family:var(--font-num);text-align:right}
.daily .lo{color:var(--ink-soft)}
.track{position:relative;height:6px;border-radius:3px;background:var(--line)}
.track i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#6FA8DC,var(--sun))}

footer{margin-top:2.5rem;font-size:.75rem;color:var(--ink-soft)}
footer a{color:inherit}

.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}}
@media (max-width:480px){
  .daily li{grid-template-columns:3.6rem 1.8rem 2.4rem 2rem 1fr 2rem;gap:.45rem;font-size:.92rem}
  .btn.loc span{display:none}
}
</style>
</head>
<body>
<main>
  <div class="bar">
    <form id="search" role="search">
      <input id="q" type="search" placeholder="都市名で探す（例：札幌、Paris）" aria-label="都市名" autocomplete="off">
      <button class="btn" type="submit">検索</button>
    </form>
    <button class="btn loc" id="geo" type="button" aria-label="現在地の天気を表示">📍<span> 現在地</span></button>
    <ul class="results" id="results" hidden></ul>
  </div>
  <p class="notice" id="notice" role="status"></p>

  <section class="hero" id="hero" aria-live="polite">
    <p class="place" id="place">読み込み中…</p>
  </section>

  <h2>これから24時間</h2>
  <div class="hourly" id="hourly" tabindex="0" aria-label="24時間の気温と降水確率"></div>

  <h2>7日間</h2>
  <ul class="daily" id="daily"></ul>

  <footer>気象データ：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
</main>

<script>
(() => {
  const DEFAULT_PLACE = { name: "東京", region: "東京都, 日本", lat: 35.6895, lon: 139.6917 };
  const STORE_KEY = "soramoyou:place";

  const WMO = {
    0:["快晴","clear"],1:["晴れ","clear"],2:["晴れ時々くもり","partly"],3:["くもり","cloudy"],
    45:["霧","fog"],48:["着氷性の霧","fog"],
    51:["弱い霧雨","rain"],53:["霧雨","rain"],55:["強い霧雨","rain"],56:["着氷性の霧雨","rain"],57:["着氷性の霧雨","rain"],
    61:["小雨","rain"],63:["雨","rain"],65:["大雨","rain"],66:["着氷性の雨","rain"],67:["着氷性の強い雨","rain"],
    71:["小雪","snow"],73:["雪","snow"],75:["大雪","snow"],77:["霧雪","snow"],
    80:["にわか雨","rain"],81:["強いにわか雨","rain"],82:["激しいにわか雨","rain"],
    85:["にわか雪","snow"],86:["強いにわか雪","snow"],
    95:["雷雨","storm"],96:["ひょうを伴う雷雨","storm"],99:["激しいひょうを伴う雷雨","storm"]
  };
  const wmo = c => WMO[c] || ["不明","cloudy"];

  /* ---------- icons ---------- */
  const CLOUD = '<path d="M20 47h25a10 10 0 0 0 1.5-19.9A14 14 0 0 0 20 25.5 11 11 0 0 0 20 47z" fill="var(--sky-b)" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>';
  const SUN = (cx,cy,r) => {
    let rays = "";
    for (let i=0;i<8;i++){ const a=i*Math.PI/4, r1=r+5, r2=r+10;
      rays += `<line x1="${cx+r1*Math.cos(a)}" y1="${cy+r1*Math.sin(a)}" x2="${cx+r2*Math.cos(a)}" y2="${cy+r2*Math.sin(a)}"/>`; }
    return `<g stroke="var(--sun)" stroke-width="2.6" stroke-linecap="round" fill="none"><circle cx="${cx}" cy="${cy}" r="${r}"/>${rays}</g>`;
  };
  const MOON = (cx,cy,s) => `<path transform="translate(${cx-32*s} ${cy-32*s}) scale(${s})" d="M40 14a20 20 0 1 0 12 30A16 16 0 0 1 40 14z" fill="none" stroke="var(--sun)" stroke-width="${2.6/s}" stroke-linejoin="round"/>`;
  function icon(kind, isDay, attrs=""){
    let g = "";
    switch(kind){
      case "clear": g = isDay ? SUN(32,32,11) : MOON(32,32,1); break;
      case "partly": g = (isDay ? SUN(23,22,8) : MOON(24,22,.6)) + `<g transform="translate(4 4)">${CLOUD}</g>`; break;
      case "cloudy": g = CLOUD; break;
      case "fog": g = '<g stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="24" x2="52" y2="24"/><line x1="8" y1="33" x2="46" y2="33"/><line x1="16" y1="42" x2="56" y2="42"/></g>'; break;
      case "rain": g = `<g transform="translate(0 -6)">${CLOUD}</g><g stroke="var(--rain)" stroke-width="2.6" stroke-linecap="round"><line x1="22" y1="48" x2="19" y2="56"/><line x1="32" y1="48" x2="29" y2="56"/><line x1="42" y1="48" x2="39" y2="56"/></g>`; break;
      case "snow": g = `<g transform="translate(0 -6)">${CLOUD}</g><g fill="currentColor"><circle cx="21" cy="52" r="2.2"/><circle cx="32" cy="55" r="2.2"/><circle cx="43" cy="52" r="2.2"/></g>`; break;
      case "storm": g = `<g transform="translate(0 -6)">${CLOUD}</g><path d="M33 44l-6 9h6l-4 8 10-11h-6l4-6z" fill="var(--sun)"/>`; break;
    }
    return `<svg viewBox="0 0 64 64" aria-hidden="true" ${attrs}>${g}</svg>`;
  }

  /* ---------- helpers ---------- */
  const $ = id => document.getElementById(id);
  const r0 = n => Math.round(n);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const notice = (msg, demo=false) => { const n=$("notice"); n.textContent = msg || ""; n.className = "notice" + (demo ? " demo" : ""); };
  async function getJSON(url){
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 8000);
    try { const res = await fetch(url, {signal: ctl.signal}); if(!res.ok) throw new Error(res.status); return await res.json(); }
    finally { clearTimeout(t); }
  }
  const save = p => { try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch(e){} };
  const restore = () => { try { const v = JSON.parse(localStorage.getItem(STORE_KEY)); return v && typeof v.lat === "number" ? v : null; } catch(e){ return null; } };

  /* ---------- demo data (Open-Meteo shape) ---------- */
  function demoData(){
    const pad = n => String(n).padStart(2,"0");
    const now = new Date(); const start = new Date(now); start.setHours(0,0,0,0);
    const time=[], temperature_2m=[], precipitation_probability=[], weather_code=[];
    const dayCodes = [1,2,61,3,0,80,1];
    for(let i=0;i<7*24;i++){
      const d = new Date(start.getTime() + i*3600e3), day = Math.floor(i/24), h = d.getHours();
      time.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(h)}:00`);
      const base = 19 + [0,1,-2,0,2,-1,1][day];
      temperature_2m.push(+(base + 5*Math.sin((h-9)/24*2*Math.PI)).toFixed(1));
      const code = dayCodes[day];
      const wet = WMO[code][1]==="rain";
      weather_code.push(wet && (h<9||h>18) ? 3 : code);
      precipitation_probability.push(wet ? 50 + (h%5)*8 : (code===3?20:(h%7)));
    }
    const ci = now.getHours();
    const daily = {time:[],weather_code:[],temperature_2m_max:[],temperature_2m_min:[],precipitation_probability_max:[]};
    for(let d=0;d<7;d++){
      const sl = temperature_2m.slice(d*24,d*24+24), pp = precipitation_probability.slice(d*24,d*24+24);
      daily.time.push(time[d*24].slice(0,10)); daily.weather_code.push(dayCodes[d]);
      daily.temperature_2m_max.push(Math.max(...sl)); daily.temperature_2m_min.push(Math.min(...sl));
      daily.precipitation_probability_max.push(Math.max(...pp));
    }
    return {
      current:{ time: time[ci], temperature_2m: temperature_2m[ci], apparent_temperature: temperature_2m[ci]-1.2,
        relative_humidity_2m: 62, wind_speed_10m: 3.4, weather_code: weather_code[ci], is_day: ci>=6&&ci<18?1:0 },
      hourly:{ time, temperature_2m, precipitation_probability, weather_code }, daily
    };
  }

  /* ---------- render ---------- */
  function render(data, place){
    const c = data.current, [label, kind] = wmo(c.weather_code), isDay = !!c.is_day;
    document.documentElement.dataset.sky = kind==="storm" ? "storm" : !isDay ? "night" : ({partly:"clear"}[kind] || kind);
    const today = data.daily;
    $("hero").innerHTML = `
      <p class="place">${esc(place.name)}${place.region ? `<small>${esc(place.region)}</small>` : ""}</p>
      <p class="temp fade">${r0(c.temperature_2m)}<sup>°C</sup></p>
      ${icon(kind, isDay, 'class="hero-icon fade"')}
      <p class="cond">${label}<span class="range">最高 ${r0(today.temperature_2m_max[0])}° / 最低 ${r0(today.temperature_2m_min[0])}°</span></p>
      <dl class="facts">
        <div><dt>体感</dt><dd>${r0(c.apparent_temperature)}°</dd></div>
        <div><dt>湿度</dt><dd>${r0(c.relative_humidity_2m)}%</dd></div>
        <div><dt>風速</dt><dd>${(c.wind_speed_10m).toFixed(1)} m/s</dd></div>
        <div><dt>降水確率</dt><dd>${r0(today.precipitation_probability_max[0] ?? 0)}%</dd></div>
      </dl>
      <p class="stamp">${c.time.slice(5,10).replace("-","月")}日 ${c.time.slice(11,16)} 時点</p>`;
    renderHourly(data);
    renderDaily(data.daily);
    document.title = `${place.name} ${r0(c.temperature_2m)}° ${label}｜そらもよう`;
  }

  function renderHourly(data){
    const H = data.hourly, cur = data.current.time;
    let idx = H.time.findIndex(t => t > cur) - 1; if (idx < 0) idx = 0;
    const n = Math.min(25, H.time.length - idx), col = 58, W = n*col, Ht = 176;
    const temps = H.temperature_2m.slice(idx, idx+n);
    const lo = Math.min(...temps), hi = Math.max(...temps), span = Math.max(hi-lo, 1);
    const y = t => 32 + (1-(t-lo)/span)*54;
    const pts = temps.map((t,i)=>[i*col+col/2, y(t)]);
    let out = `<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    for(let i=0;i<n;i++){
      const k = idx+i, [x,py] = pts[i], hr = +H.time[k].slice(11,13);
      const isDay = hr>=6 && hr<18, [lab, kind] = wmo(H.weather_code[k]), pop = H.precipitation_probability?.[k] ?? 0;
      out += `<circle cx="${x}" cy="${py}" r="3.2" fill="currentColor"/>
        <text x="${x}" y="${py-10}" text-anchor="middle" font-size="14">${r0(temps[i])}°</text>
        <svg x="${x-14}" y="104" width="28" height="28" viewBox="0 0 64 64"><title>${lab}</title>${icon(kind,isDay).replace(/^<svg[^>]*>|<\/svg>$/g,"")}</svg>
        ${pop>=10 ? `<text class="pop" x="${x}" y="148" text-anchor="middle" font-size="12">${pop}%</text>` : ""}
        <text class="soft" x="${x}" y="168" text-anchor="middle" font-size="12">${i===0 ? "今" : hr+"時"}</text>`;
    }
    $("hourly").innerHTML = `<svg width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}" style="color:var(--ink)">${out}</svg>`;
    $("hourly").scrollLeft = 0;
  }

  function renderDaily(D){
    const lo = Math.min(...D.temperature_2m_min), hi = Math.max(...D.temperature_2m_max), span = Math.max(hi-lo,1);
    const wd = "日月火水木金土";
    $("daily").innerHTML = D.time.map((t,i)=>{
      const dt = new Date(t+"T00:00"), [lab, kind] = wmo(D.weather_code[i]);
      const mn = D.temperature_2m_min[i], mx = D.temperature_2m_max[i];
      const left = (mn-lo)/span*100, width = Math.max((mx-mn)/span*100, 4);
      return `<li>
        <span class="d">${i===0 ? "今日" : wd[dt.getDay()]+"曜"}<small>${dt.getMonth()+1}/${dt.getDate()}</small></span>
        ${icon(kind, true, `role="img" aria-label="${lab}"`).replace('aria-hidden="true"','')}
        <span class="p">${D.precipitation_probability_max[i] ?? 0}%</span>
        <span class="lo">${r0(mn)}°</span>
        <span class="track" aria-hidden="true"><i style="left:${left}%;width:${width}%"></i></span>
        <span class="hi">${r0(mx)}°</span>
      </li>`;
    }).join("");
  }

  /* ---------- data loading ---------- */
  async function loadWeather(place){
    $("results").hidden = true;
    const url = "https://api.open-meteo.com/v1/forecast?latitude="+place.lat+"&longitude="+place.lon+
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day"+
      "&hourly=temperature_2m,precipitation_probability,weather_code"+
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
      "&wind_speed_unit=ms&timezone=auto&forecast_days=7";
    try {
      const data = await getJSON(url);
      render(data, place); notice(""); save(place);
    } catch(e){
      render(demoData(), place);
      notice("デモデータを表示中です。この環境から気象APIに接続できませんでした。ローカルや自分のサーバーで開くと実際の天気に切り替わります。", true);
    }
  }

  $("search").addEventListener("submit", async ev => {
    ev.preventDefault();
    const q = $("q").value.trim(); if(!q) return;
    const list = $("results");
    try {
      const r = await getJSON("https://geocoding-api.open-meteo.com/v1/search?count=6&language=ja&format=json&name="+encodeURIComponent(q));
      if(!r.results?.length){ notice(`「${q}」に一致する都市が見つかりません。別の表記（ローマ字など）で試してください。`); list.hidden = true; return; }
      list.innerHTML = r.results.map((p,i)=>`<li><button type="button" data-i="${i}">${esc(p.name)}<small>${esc([p.admin1,p.country].filter(Boolean).join(", "))}</small></button></li>`).join("");
      list.hidden = false;
      list.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        const p = r.results[+b.dataset.i];
        $("q").value = "";
        loadWeather({ name: p.name, region: [p.admin1,p.country].filter(Boolean).join(", "), lat: p.latitude, lon: p.longitude });
      }));
      list.querySelector("button").focus();
    } catch(e){
      notice("都市検索には外部APIへの接続が必要です。この環境では使えないため、ローカルで開いてお試しください。", true);
    }
  });
  document.addEventListener("keydown", e => { if(e.key==="Escape") $("results").hidden = true; });
  document.addEventListener("click", e => { if(!e.target.closest(".bar")) $("results").hidden = true; });

  $("geo").addEventListener("click", () => {
    if(!("geolocation" in navigator)){ notice("このブラウザは位置情報に対応していません。都市名で検索してください。"); return; }
    notice("現在地を取得しています…");
    navigator.geolocation.getCurrentPosition(
      pos => loadWeather({ name: "現在地", region: `${pos.coords.latitude.toFixed(2)}, ${pos.coords.longitude.toFixed(2)}`, lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => notice("現在地を取得できませんでした。位置情報の許可を確認するか、都市名で検索してください。"),
      { timeout: 10000, maximumAge: 600000 }
    );
  });

  loadWeather(restore() || DEFAULT_PLACE);
})();
</script>
</body>
</html>
